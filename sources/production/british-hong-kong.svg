<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<title>British Hong Kong (1959-1997) circular flag — flat Surge icon</title>
<desc>Original stylized round icon based on historical British Hong Kong blue ensign. Transparent outer background.</desc>
<defs>
 <clipPath id="round"><circle cx="256" cy="256" r="246"/></clipPath>
 <clipPath id="uk"><rect x="10" y="10" width="267" height="224"/></clipPath>
</defs>
